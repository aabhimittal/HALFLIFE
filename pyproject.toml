[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "halflife"
version = "0.2.0"
description = "Measure how long a poisoned memory survives background consolidation in LLM agents."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []
authors = [{ name = "Abhishek Mittal" }]
keywords = ["llm", "agents", "memory", "prompt-injection", "security", "benchmark"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Repository = "https://github.com/aabhimittal/HALFLIFE"

[project.optional-dependencies]
claude = ["anthropic"]
dev = ["pytest>=7", "ruff"]

[project.scripts]
halflife = "halflife.cli:main"

[tool.setuptools.packages.find]
include = ["halflife*"]

[tool.setuptools.package-data]
halflife = ["showcase_template.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "PLE"]
ignore = ["E741", "E731"]  # `l` for "lineage" in comprehensions; small local lambdas are fine
